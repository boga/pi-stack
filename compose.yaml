name: pi-roamgate

networks:
  herdr_net:
    driver: bridge

volumes:
  herdr_state:
  pi_state:
  roamgate_state:
  herdr_socket:

services:
  herdr:
    build:
      context: .
      dockerfile: Dockerfile.herdr
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
        GH_VERSION: ${GH_VERSION:-2.101.0}
        KUBECTL_VERSION: ${KUBECTL_VERSION:-v1.37.0}
        HERDR_VERSION: ${HERDR_VERSION:-0.9.1}
        PI_PACKAGE_VERSION: ${PI_PACKAGE_VERSION:-0.87.0}
        WORKTRUNK_VERSION: ${WORKTRUNK_VERSION:-0.79.0}
    image: pi-roamgate/herdr:${HERDR_VERSION:-0.9.1}
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      HERDR_SOCKET_PATH: /run/herdr/herdr.sock
    volumes:
      - herdr_state:/home/herdr/.config/herdr
      - pi_state:/home/herdr/.pi/agent
      - herdr_socket:/run/herdr:rw
      - type: bind
        source: ${WORKSPACE_DIR:-./workspace}
        target: /workspace
        bind:
          create_host_path: false
    networks:
      - herdr_net
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/herdr/herdr.sock && test -S /run/herdr/herdr-client.sock"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 6
    # No published ports: herdr has no TCP listener.

  pi:
    build:
      context: .
      dockerfile: Dockerfile.pi
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
        GH_VERSION: ${GH_VERSION:-2.101.0}
        KUBECTL_VERSION: ${KUBECTL_VERSION:-v1.37.0}
        HERDR_VERSION: ${HERDR_VERSION:-0.9.1}
        PI_PACKAGE_VERSION: ${PI_PACKAGE_VERSION:-0.87.0}
        WORKTRUNK_VERSION: ${WORKTRUNK_VERSION:-0.79.0}
    image: pi-roamgate/pi:${PI_PACKAGE_VERSION:-0.87.0}
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      HERDR_SOCKET_PATH: /run/herdr/herdr.sock
      HERDR_WAIT_TIMEOUT: ${HERDR_WAIT_TIMEOUT:-60}
      # HERDR_ENV is deliberately left UNSET here. It is meant to be
      # injected by herdr into real pane child processes, along with a
      # truthful HERDR_PANE_ID. This standalone container cannot supply a
      # truthful pane id, so we do not fake it.
    volumes:
      - pi_state:/home/pi/.pi/agent
      - herdr_socket:/run/herdr:ro
      - type: bind
        source: ${WORKSPACE_DIR:-./workspace}
        target: /workspace
        bind:
          create_host_path: false
    networks:
      - herdr_net
    depends_on:
      herdr:
        condition: service_healthy

  roamgate:
    build:
      context: .
      dockerfile: Dockerfile.roamgate
      target: ${ROAMGATE_BUILD_TARGET:-runtime}
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
        ROAMGATE_VERSION: ${ROAMGATE_VERSION:-0.7.8}
    image: pi-roamgate/roamgate:${ROAMGATE_VERSION:-0.7.8}
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:exec,mode=1777,size=256m
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      HERDR_SOCKET_PATH: /run/herdr/herdr.sock
      HERDR_CLIENT_SOCKET_PATH: /run/herdr/herdr-client.sock
      HERDR_WAIT_TIMEOUT: ${HERDR_WAIT_TIMEOUT:-60}
      ROAMGATE_PASSWORD: ${ROAMGATE_PASSWORD:?set ROAMGATE_PASSWORD in .env}
      ROAMGATE_DISABLE_UPDATE_CHECK: "1"
      # NEVER set ROAMGATE_RESTART_SUPERVISOR — it fights Docker's restart policy.
    volumes:
      - roamgate_state:/home/roamgate/.config/herdr
      - herdr_socket:/run/herdr:ro
      - type: bind
        source: ${WORKSPACE_DIR:-./workspace}
        target: /workspace
        bind:
          create_host_path: false
    ports:
      - "${ROAMGATE_BIND_ADDRESS:-127.0.0.1}:${ROAMGATE_HOST_PORT:-8787}:8787"
    networks:
      - herdr_net
    depends_on:
      herdr:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 6
